name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    # Pinned rather than ubuntu-latest, which GitHub is moving to ubuntu-26.04. On that image
    # kind failed to load the multi-platform Kahuna image ("ctr: content digest ... not found"),
    # so every run failed in BeforeSuite.
    runs-on: ubuntu-24.04
    # The suite walks a real cluster through bootstrap, a scale out and back, and a rolling
    # restart. Each membership change waits out SWIM's suspicion and eviction-grace windows, so
    # the wall-clock floor is minutes and no tuning removes it.
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # A fixed release rather than dl/latest, which serves whatever alpha build is newest and so
      # changes the cluster under test between two runs of the same commit.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ./kind" | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e

      # The suite tears its namespace down on success, so this only ever runs against a cluster
      # that is still in whatever state broke it.
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get kahunaclusters -A -o yaml || true
          kubectl -n kahuna-e2e get pods,sts,svc,cm,pvc || true
          kubectl -n kahuna-e2e describe pods || true
          for p in $(kubectl -n kahuna-e2e get pods -o name 2>/dev/null); do
            echo "===== $p ====="
            kubectl -n kahuna-e2e logs "$p" --tail=200 || true
          done
          kubectl -n kahuna-operator-system logs deployment/kahuna-operator-controller-manager --tail=300 || true
