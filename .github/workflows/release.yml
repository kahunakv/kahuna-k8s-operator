name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0"
        required: true

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The Kahuna server publishes amd64 and arm64; matching that keeps the operator installable
  # wherever the thing it manages already runs, without paying for architectures nobody uses.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  release:
    name: Publish image, chart and installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # A tag push carries the version; a manual run supplies it. Everything downstream — image
      # tag, chart version, installer image reference — is derived from this one value so they
      # cannot disagree.
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          case "$VERSION" in
            v*) ;;
            *) echo "version must start with v, got '$VERSION'" >&2; exit 1 ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}"

      # The release must not be the first time the tests run against this commit.
      - name: Verify
        run: |
          go mod tidy
          make test

      # Pinned rather than relying on whatever the runner image happens to ship, so a runner image
      # update cannot change what a release is built with.
      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.16.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A single self-contained manifest for people who do not use Helm. It pins the image to the
      # version being released rather than to :latest, so applying it twice cannot silently move
      # the operator.
      - name: Build the install manifest
        run: |
          make build-installer \
            IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      # Chart version and appVersion come from the tag rather than from Chart.yaml, so a release
      # cannot ship a chart that claims a different version than the image it deploys.
      - name: Package and push the Helm chart
        run: |
          ./hack/sync-helm.sh
          helm package charts/kahuna-operator \
            --version "${{ steps.version.outputs.semver }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist
          helm push "dist/kahuna-operator-${{ steps.version.outputs.semver }}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/install.yaml
            dist/kahuna-operator-${{ steps.version.outputs.semver }}.tgz
          body: |
            ## Install

            Helm:

            ```bash
            helm install kahuna-operator \
              oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/kahuna-operator \
              --version ${{ steps.version.outputs.semver }} \
              --namespace kahuna-system --create-namespace
            ```

            Or apply the bundled manifest:

            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/install.yaml
            ```

            Upgrading across a CRD change requires applying the CRD yourself first — Helm never
            upgrades files under `crds/`. See the chart README.
