                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - endpoint
                x-kubernetes-list-type: map
              membershipVersion:
                description: membershipVersion is the committed roster version. It
                  advances on every admitted change.
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              phase:
                description: phase is a coarse summary of what the operator is doing.
