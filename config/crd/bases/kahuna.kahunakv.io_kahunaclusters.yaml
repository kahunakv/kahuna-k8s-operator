                format: int32
                type: integer
              updatePartition:
                description: |-
                  updatePartition is the StatefulSet rolling-update partition the operator is currently
                  holding. Nodes at or above this ordinal have been updated.
                format: int32
                type: integer
              voters:
                description: voters is the number of Voters in the committed roster.
