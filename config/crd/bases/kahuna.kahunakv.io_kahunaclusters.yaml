                    format: int32
                    type: integer
                  defaultTimeoutMs:
                    description: defaultTimeoutMs for a transaction (--default-transaction-timeout).
                    format: int32
                    type: integer
                  maxAdmissionWaitMs:
                    description: maxAdmissionWaitMs is the hard upper bound on any
