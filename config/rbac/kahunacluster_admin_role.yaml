# This rule is not used by the project kahuna-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kahuna.kahunakv.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kahuna-operator
    app.kubernetes.io/managed-by: kustomize
  name: kahunacluster-admin-role
rules:
- apiGroups:
  - kahuna.kahunakv.io
  resources:
  - kahunaclusters
  verbs:
  - '*'
- apiGroups:
  - kahuna.kahunakv.io
  resources:
  - kahunaclusters/status
  verbs:
  - get
